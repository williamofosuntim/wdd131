<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temple Album</title>
    <meta name="description" content="A responsive photo album showcasing temples of The Church of Jesus Christ of Latter-day Saints from around the world.">
    <meta name="author" content="William Ofosu Ntim">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fjalla+One&family=Libre+Baskerville:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/temples.css">
    <link rel="stylesheet" href="styles/temples-large.css">
    <script src="scripts/temples.js" defer></script>
</head>
<body>
    <header>
        <p class="site-title">Temple Album</p>
        <button id="menu" aria-label="Toggle navigation menu" aria-expanded="false">☰</button>
        <nav>
            <a href="#">Home</a>
            <a href="#">Old</a>
            <a href="#">New</a>
            <a href="#" aria-current="page">Large</a>
            <a href="#">Small</a>
        </nav>
    </header>

    <main>
        <h1>Temple Album</h1>
        <div class="container">
            <figure>
                <img src="images/accra.jpeg" alt="Accra Ghana Temple" width="700" height="350" loading="lazy">
                <figcaption>Accra Ghana</figcaption>
            </figure>

            <figure>
                <img src="images/alabang.jpeg" alt="Alabang Philippines Temple" width="700" height="694" loading="lazy">
                <figcaption>Alabang Philippines</figcaption>
            </figure>

            <figure>
                <img src="images/anchorage.jpeg" alt="Anchorage Alaska Temple" width="700" height="350" loading="lazy">
                <figcaption>Anchorage Alaska</figcaption>
            </figure>

            <figure>
                <img src="images/bacolod.jpeg" alt="Bacolod Philippines Temple" width="700" height="483" loading="lazy">
                <figcaption>Bacolod Philippines</figcaption>
            </figure>

            <figure>
                <img src="images/burley.jpeg" alt="Burley Idaho Temple" width="700" height="486" loading="lazy">
                <figcaption>Burley Idaho</figcaption>
            </figure>

            <figure>
                <img src="images/draper.jpeg" alt="Draper Utah Temple" width="700" height="437" loading="lazy">
                <figcaption>Draper Utah</figcaption>
            </figure>

            <figure>
                <img src="images/freiberg.jpeg" alt="Freiberg Germany Temple" width="700" height="437" loading="lazy">
                <figcaption>Freiberg Germany</figcaption>
            </figure>

            <figure>
                <img src="images/laie_hawaii.jpeg" alt="Laie Hawaii Temple" width="700" height="437" loading="lazy">
                <figcaption>Laie Hawaii</figcaption>
            </figure>

            <figure>
                <img src="images/temple_rendering.jpeg" alt="Birmingham England Temple rendering" width="700" height="555" loading="lazy">
                <figcaption>Rendering Birmingham</figcaption>
            </figure>

            <figure>
                <img src="images/temple_rendering(2).jpeg" alt="Norfolk Virginia Temple rendering" width="700" height="525" loading="lazy">
                <figcaption>Rendering Norfolk Virginia</figcaption>
            </figure>
        </div>
    </main>

    <footer>
        <p>&copy; <span id="currentyear"></span> William Ofosu Ntim | Accra, Ghana</p>
        <p id="lastModified"></p>
    </footer>
</body>
</html>
