<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-labelledby="title desc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="title">Partly Cloudy</title>
  <desc id="desc">A sun partially covered by a cloud, representing partly cloudy weather.</desc>

  <!-- Sun rays -->
  <g stroke="#FCD116" stroke-width="4" stroke-linecap="round">
    <line x1="66" y1="14" x2="66" y2="4"></line>
    <line x1="66" y1="14" x2="80" y2="8" transform="rotate(20 66 14)"></line>
    <line x1="88" y1="30" x2="98" y2="26"></line>
    <line x1="88" y1="30" x2="98" y2="30" transform="rotate(-20 88 30)"></line>
    <line x1="44" y1="8" x2="38" y2="0"></line>
    <line x1="86" y1="14" x2="94" y2="8"></line>
  </g>

  <!-- Sun -->
  <circle cx="66" cy="34" r="18" fill="#FCD116"></circle>

  <!-- Cloud -->
  <g fill="#F5F5F5" stroke="#B0B0B0" stroke-width="1.5">
    <path d="M28 78
             c-8 0 -14 -6 -14 -13
             c0 -7 6 -13 13.5 -13
             c1.5 -8 8.5 -14 17 -14
             c9 0 16.5 6.5 18 15
             c7 0.5 12.5 6.5 12.5 13.5
             c0 7.5 -6 13.5 -13.5 13.5
             z"></path>
  </g>
</svg>
